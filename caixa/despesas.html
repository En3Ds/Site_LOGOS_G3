<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Caixa | Logos G.3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body{display:block;align-items:normal;justify-content:normal;padding:32px 20px}
  .wrap{max-width:900px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .top h1{font-family:Fraunces,serif;font-size:22px;margin:0}
  .top .actions{display:flex;gap:8px}
  .top button{width:auto;margin:0;padding:8px 16px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;cursor:pointer}
  .top button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  .novo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px}
  .novo form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
  .novo label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .novo input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:14px}
  .novo button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}

  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  td.valor{text-align:right;font-variant-numeric:tabular-nums}
  td.acao{text-align:right}
  td.acao button{background:none;border:0;color:#DC2626;cursor:pointer;font-size:13px}
  tfoot td{font-weight:700;border-top:2px solid var(--ink)}
  .vazio{padding:24px;text-align:center;color:var(--muted)}

  @media print{
    .top .actions, .novo, td.acao, th:last-child { display:none !important; }
    body{background:#fff;padding:0}
    table{border:1px solid #000}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Controle de Caixa — Logos G.3</h1>
    <div class="actions">
      <a href="pessoal.html" style="padding:8px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px">Glerton/Claudio</a>
      <a href="compras.html" style="padding:8px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px">Lista de compras</a>
      <a href="importar.html" style="padding:8px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px">Importar histórico</a>
      <button id="imprimir">Imprimir</button>
      <button id="sair">Sair</button>
    </div>
  </div>

  <div class="novo">
    <form id="form-despesa">
      <div>
        <label for="descricao">Descrição</label>
        <input id="descricao" required>
      </div>
      <div>
        <label for="valor">Valor (R$)</label>
        <input id="valor" type="number" step="0.01" min="0" required>
      </div>
      <div>
        <label for="vencimento">Vencimento</label>
        <input id="vencimento" type="date" required>
      </div>
      <div>
        <label for="comprovante">Comprovante</label>
        <input id="comprovante" type="file" accept="image/*,.pdf">
      </div>
      <button type="submit" id="btn-salvar">Adicionar</button>
    </form>
    <p id="editando-aviso" style="display:none;margin:10px 0 0;font-size:13px;color:var(--muted)">
      Editando despesa. <a href="#" id="cancelar-edicao">Cancelar</a>
    </p>
  </div>

  <table>
    <thead>
      <tr><th>Descrição</th><th>Vencimento</th><th class="valor">Valor</th><th></th></tr>
    </thead>
    <tbody id="linhas"></tbody>
    <tfoot>
      <tr><td colspan="2">Total</td><td class="valor" id="total">R$ 0,00</td><td></td></tr>
    </tfoot>
  </table>
  <p id="vazio" class="vazio" style="display:none">Nenhuma despesa lançada ainda.</p>

  <div class="obs-box" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px">
    <label for="obs" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Observações</label>
    <textarea id="obs" rows="4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:14px;font-family:inherit" placeholder="Anotações gerais..."></textarea>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="firebase-cfg.js"></script>
<script src="caixa-common.js"></script>
<script src="caixa-api.js"></script>
<script>
var editandoId = null;
var comprovanteArquivo = null; // File escolhido, ainda não subiu
var comprovanteUrl = null;     // vira uma URL do Firebase Storage depois de subir
var comprovanteNome = null;

document.getElementById("comprovante").addEventListener("change", function(){
  var arquivo = this.files[0];
  comprovanteArquivo = arquivo || null;
  comprovanteUrl = null;
  comprovanteNome = arquivo ? arquivo.name : null;
});

// Comprovante agora vai pro Firebase Storage (já estava configurado, só não era usado)
// em vez de virar base64 dentro do banco — arquivo grande não deixa a página pesada.
function subirComprovanteSePreciso(){
  if (!comprovanteArquivo) return Promise.resolve();
  var nomeArmazenado = Date.now() + "-" + comprovanteArquivo.name;
  var ref = firebase.storage().ref("comprovantes/" + nomeArmazenado);
  return ref.put(comprovanteArquivo)
    .then(function(){ return ref.getDownloadURL(); })
    .then(function(url){ comprovanteUrl = url; });
}

function carregar(){ return api("GET", "despesas"); }
function formataReal(v){
  return "R$ " + Number(v).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formataData(iso){
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}

function render(){
  carregar().then(function(lista){
    var corpo = document.getElementById("linhas");
    var vazio = document.getElementById("vazio");
    corpo.innerHTML = "";
    vazio.style.display = lista.length ? "none" : "block";

    var total = 0;
    lista.forEach(function(item){
      total += Number(item.valor);
      var tr = document.createElement("tr");
      var linkComprovante = item.comprovante
        ? "<a href='" + item.comprovante.replace(/'/g,"&#39;") + "' target='_blank' rel='noopener' download='" + String(item.comprovante_nome || "comprovante").replace(/</g,"&lt;").replace(/'/g,"&#39;") + "' style='font-size:12px'>comprovante</a>"
        : "";
      tr.innerHTML =
        "<td>" + String(item.descricao).replace(/</g,"&lt;") + " " + linkComprovante + "</td>" +
        "<td>" + formataData(item.vencimento) + "</td>" +
        "<td class='valor'>" + formataReal(item.valor) + "</td>" +
        "<td class='acao'>" +
          "<button data-editar='" + item.id + "'>editar</button> " +
          "<button data-id='" + item.id + "'>remover</button>" +
        "</td>";
      corpo.appendChild(tr);
    });
    document.getElementById("total").textContent = formataReal(total);

    corpo.querySelectorAll("button[data-id]").forEach(function(b){
      b.addEventListener("click", function(){
        api("DELETE", "despesas/" + b.getAttribute("data-id")).then(render);
      });
    });
    corpo.querySelectorAll("button[data-editar]").forEach(function(b){
      b.addEventListener("click", function(){
        var item = lista.filter(function(x){ return String(x.id) === b.getAttribute("data-editar"); })[0];
        if (!item) return;
        editandoId = item.id;
        document.getElementById("descricao").value = item.descricao;
        document.getElementById("valor").value = item.valor;
        document.getElementById("vencimento").value = item.vencimento;
        document.getElementById("btn-salvar").textContent = "Salvar edição";
        document.getElementById("editando-aviso").style.display = "block";
        document.getElementById("descricao").focus();
      });
    });
  }).catch(function(err){
    document.getElementById("vazio").style.display = "block";
    document.getElementById("vazio").textContent = "Erro ao carregar do banco: " + err.message;
  });
}

function saiDaEdicao(){
  editandoId = null;
  comprovanteArquivo = null;
  comprovanteUrl = null;
  comprovanteNome = null;
  document.getElementById("form-despesa").reset();
  document.getElementById("btn-salvar").textContent = "Adicionar";
  document.getElementById("editando-aviso").style.display = "none";
}

document.getElementById("cancelar-edicao").addEventListener("click", function(e){
  e.preventDefault();
  saiDaEdicao();
});

document.getElementById("form-despesa").addEventListener("submit", function(e){
  e.preventDefault();
  var descricao = document.getElementById("descricao").value;
  var valor = Number(document.getElementById("valor").value);
  var vencimento = document.getElementById("vencimento").value;
  var btn = document.getElementById("btn-salvar");
  btn.disabled = true;
  subirComprovanteSePreciso().then(function(){
    var dados = { descricao: descricao, valor: valor, vencimento: vencimento };
    if (comprovanteUrl) { dados.comprovante = comprovanteUrl; dados.comprovante_nome = comprovanteNome; }
    return editandoId ? api("PUT", "despesas/" + editandoId, dados) : api("POST", "despesas", dados);
  }).then(function(){
    saiDaEdicao();
    render();
  }).catch(function(err){
    alert("Erro ao salvar: " + err.message);
  }).finally(function(){
    btn.disabled = false;
  });
});

document.getElementById("imprimir").addEventListener("click", function(){ window.print(); });

// Observações: carrega uma vez e salva sozinho quando o campo perde o foco.
api("GET", "notas/1").then(function(r){
  document.getElementById("obs").value = r.texto || "";
});
document.getElementById("obs").addEventListener("blur", function(){
  api("PUT", "notas/1", { texto: this.value });
});

render();
</script>
</body>
</html>
