<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Caixa | Logos G.3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body{display:block;padding:40px 20px}
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .top button{width:auto;margin:0;padding:8px 16px;background:transparent;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 style="font-family:Fraunces,serif;font-size:22px;margin:0">Controle de Caixa</h1>
    <button id="sair">Sair</button>
  </div>
  <p id="status">Verificando login…</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const status = document.getElementById("status");

const token = sessionStorage.getItem("idToken");
if (!token) {
  location.href = "login.html";
} else {
  // a prova real: manda o token pro servidor e pergunta quem sou eu
  fetch("/api/me", { headers: { Authorization: "Bearer " + token } })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((me) => {
      status.textContent = `Login confirmado pelo servidor: ${me.email}. Proxima fase: lancamentos de despesa.`;
    })
    .catch(() => {
      sessionStorage.removeItem("idToken");
      location.href = "login.html";
    });
}

document.getElementById("sair").addEventListener("click", async () => {
  await signOut(auth);
  sessionStorage.removeItem("idToken");
  location.href = "login.html";
});
</script>
</body>
</html>
