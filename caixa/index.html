<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Controle de Caixa | Logos G.3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>Controle de Caixa</h1>
  <p class="lede">Logos G.3 — entre com seu e-mail e senha.</p>
  <form id="login-form">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <p id="erro" class="error"></p>
    <button type="submit" id="btn">Entrar</button>
  </form>
</div>

<!-- Trava o formulario ja, antes do Firebase carregar, pra nunca recarregar a pagina. -->
<script>
document.getElementById("login-form").addEventListener("submit", function(e){ e.preventDefault(); });
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-cfg.js"></script>
<script>
var form = document.getElementById("login-form");
var erro = document.getElementById("erro");
var btn = document.getElementById("btn");

function mostraErro(msg){
  erro.textContent = msg;
  erro.style.display = "block";
  btn.disabled = false;
  btn.textContent = "Entrar";
}

// Ja logado nessa aba? pula direto.
if (sessionStorage.getItem("logadoComo")) {
  location.href = "despesas.html";
}

if (typeof firebase === "undefined") {
  mostraErro("Nao consegui carregar o Firebase. Confira sua conexao com a internet e tente de novo.");
} else {
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  form.addEventListener("submit", function(e){
    erro.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Entrando…";
    var email = document.getElementById("email").value;
    var senha = document.getElementById("senha").value;
    auth.signInWithEmailAndPassword(email, senha)
      .then(function(cred){
        sessionStorage.setItem("logadoComo", cred.user.email);
        location.href = "despesas.html";
      })
      .catch(function(err){
        mostraErro("Erro: " + err.code + " — " + err.message);
      });
  });
}
</script>
</body>
</html>
