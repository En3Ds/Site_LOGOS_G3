<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Controle de Caixa | Logos G.3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>Controle de Caixa</h1>
  <p class="lede">Logos G.3 — entre com seu e-mail e senha.</p>
  <form id="login-form">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <p id="erro" class="error"></p>
    <button type="submit" id="btn">Entrar</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("login-form");
const erro = document.getElementById("erro");
const btn = document.getElementById("btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  erro.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const cred = await signInWithEmailAndPassword(auth, email, senha);
    const token = await cred.user.getIdToken();
    sessionStorage.setItem("idToken", token);
    location.href = "app.html";
  } catch (err) {
    erro.textContent = "E-mail ou senha incorretos.";
    erro.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
